[package]
name = "nimiq-keys"
version.workspace = true
authors = [
    "Pascal B <git@paberr.net>",
    "The Nimiq Core Development Team <info@nimiq.com>",
]
license.workspace = true
edition.workspace = true
description = "Ed25519 cryptographic key handling and signatures for Nimiq"
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[badges]
travis-ci = { repository = "nimiq/core-rs", branch = "master" }
is-it-maintained-issue-resolution = { repository = "nimiq/core-rs" }
is-it-maintained-open-issues = { repository = "nimiq/core-rs" }
maintenance = { status = "experimental" }

[lints]
workspace = true

[dependencies]
curve25519-dalek = { version = "5.0.0", features = ["digest"] }
data-encoding = "2.11"
ed25519-zebra = "4.2"
hex = "0.4"
itertools = "0.15"
p256 = "0.14"
rand = "0.10"
rand_core_compat = { version = "0.1", features = ["rand_core_0_6", "rand_core_0_10"] }
serde = { version = "1.0", optional = true }
sha2 = "0.11"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

nimiq-database-value = { workspace = true }
nimiq-hash = { workspace = true }
nimiq-hash_derive = { workspace = true }
nimiq-macros = { workspace = true }
nimiq-serde = { workspace = true, optional = true }
nimiq-utils = { workspace = true, features = ["key-rng", "merkle", "tagged-signing"] }

[dev-dependencies]
# Test-only: re-enables `Scalar::from_bits` (the deprecated, unreduced constructor) so the
# `scalar_reduction_equivalence` test can prove the production `from_bytes_mod_order` path is
# byte-identical to the historical one. Not enabled for normal/release builds, so production no
# longer depends on the `legacy_compatibility` feature.
curve25519-dalek = { version = "5.0.0", features = ["digest", "legacy_compatibility"] }
nimiq-test-log = { workspace = true }
nimiq-test-utils = { workspace = true }

[features]
serde-derive = ["nimiq-serde", "serde", "p256/serde"]
