name: Publish web-client to npm
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Resolve wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: |
          VERSION=$(awk '
            $0 == "name = \"wasm-bindgen\"" { found = 1; next }
            found && /^version = / { gsub(/version = "|"/, ""); print; exit }
          ' Cargo.lock)
          if [ -z "$VERSION" ]; then echo "::error::Could not resolve wasm-bindgen version from Cargo.lock"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}
      - name: Build package
        working-directory: ./web-client
        run: ./scripts/build.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - name: Publish to npm
        working-directory: ./web-client/dist
        run: npm publish
