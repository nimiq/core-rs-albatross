[package]
name = "nimiq-tools"
publish = false
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Tools for Nimiq's Rust implementation"
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[[bin]]
name = "nimiq-bls"
path = "src/bls/main.rs"

[[bin]]
name = "nimiq-address"
path = "src/address/main.rs"

[[bin]]
name = "nimiq-signtx"
path = "src/signtx/main.rs"

[[bin]]
name = "nimiq-mktx"
path = "src/mktx/main.rs"

[[bin]]
name = "nimiq-rpc-schema"
path = "src/rpc-schema/main.rs"

[[bin]]
name = "nimiq-trim-genesis-config"
path = "src/trim-genesis-config/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["cargo","derive"] }
convert_case = "0.12"
hex = "0.4"
log = { workspace = true }
quote = "1.0"
schemars = "1.2"
serde = "1.0"
serde_json = "1.0"
syn = { version = "3.0", features = ["full"] }
thiserror = "2.0"
toml = "1.1"

nimiq-bls = { workspace = true }
nimiq-database = { workspace = true }
nimiq-genesis-builder = { workspace = true }
nimiq-hash = { workspace = true }
nimiq-keys = { workspace = true }
nimiq-primitives = { workspace = true }
nimiq-serde = { workspace = true }
nimiq-transaction = { workspace = true }
nimiq-transaction-builder = { workspace = true, features = ["serde-derive"] }
nimiq-utils = { workspace = true }
