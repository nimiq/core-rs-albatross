[package]
name = "nimiq-vrf"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Verifiable Random Function based on VXEdDSA"
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[dependencies]
byteorder = "1.5"
curve25519-dalek = { version = "5.0.0", features = ["digest"] }
hex = "0.4"
log = { workspace = true }
num-bigint = "0.4"
rand = "0.10"
serde = { version = "1.0", optional = true }
sha2 = "0.11"

nimiq-hash = { workspace = true }
nimiq-keys = { workspace = true }
nimiq-macros = { workspace = true }
nimiq-serde = { workspace = true, optional = true }

[dev-dependencies]
nimiq-test-log = { workspace = true }
nimiq-test-utils = { workspace = true }
# Test-only: the previous (4.x) curve25519-dalek provided `nonspec_map_to_curve`, which was removed
# in 5.0 and reimplemented in `nonspec_map_to_curve`/`elligator_encode`. These pin the old
# implementation solely so the differential fuzz test can assert byte-for-byte equivalence. They are
# NOT part of the shipped binary and can be dropped once we are done trusting the port.
curve25519-dalek-4x = { package = "curve25519-dalek", version = "4.1.3", features = ["digest"] }
sha2-0_10 = { package = "sha2", version = "0.10" }

[features]
serde-derive = ["nimiq-serde", "serde"]
# Exposes `map_to_curve_compressed` for the differential AFL fuzz target that checks the
# VXEdDSA map-to-curve reimplementation against curve25519-dalek 4.x. Not for production use.
fuzzing = []
