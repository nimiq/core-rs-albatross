[package]
name = "nimiq-zkp-primitives"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Shared Primitives of Recursive SNARKs for Nimiq's Nano Nodes"
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[dependencies]
ark-crypto-primitives = { workspace = true, features = ["crh"] }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-groth16 = { workspace = true }
ark-mnt4-753 = { workspace = true }
ark-mnt6-753 = { workspace = true }
ark-relations = { workspace = true }
ark-r1cs-std = { workspace = true }
ark-serialize = { workspace = true }
ark-std = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
rand = { workspace = true, features = ["small_rng"] }
rayon = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }

nimiq-bls = { workspace = true }
nimiq-hash = { workspace = true }
nimiq-pedersen-generators = { workspace = true }
nimiq-primitives = { workspace = true, features = ["policy"] }
nimiq-serde = { workspace = true }

[dev-dependencies]
nimiq-collections = { workspace = true }
nimiq-keys = { workspace = true }
nimiq-primitives = { workspace = true, features = ["slots"] }
nimiq-utils = { workspace = true }

[features]
parallel = [
    "rayon",
    "ark-ec/parallel",
    "ark-ff/parallel",
    "ark-std/parallel",
    "ark-groth16/parallel",
    "nimiq-primitives/parallel",
]
zkp-prover = [
    "ark-crypto-primitives/r1cs",
    "ark-mnt4-753/r1cs",
    "ark-mnt6-753/r1cs",
    "ark-groth16/r1cs",
    "nimiq-primitives/zkp-prover",
]
